[project]
name = "realtime-election-prediction"
version = "0.1.0"
description = "Acompanhamento e projeção em tempo real do 2º turno 2026 a partir da apuração do TSE"
authors = [{ name = "Otavio Miranda" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "streamlit (>=1.50,<2)",
    "httpx[http2] (>=0.28,<1)",
    "pandas (>=2.2,<3)",
    "pillow (>=10)",
    "tzdata (>=2024.1)",
]

[tool.poetry]
packages = [{ include = "eleicao", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.14"

[project.scripts]
eleicao-coletar = "eleicao.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
